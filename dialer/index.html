<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Greenchild · Power-Dialer</title>
  <link rel="stylesheet" href="dialer.css">
</head>
<body>

  <!-- Login -->
  <div id="login" class="login-wrap">
    <div class="login-card">
      <h1>Power-Dialer</h1>
      <p>Zugangscode eingeben</p>
      <input id="pc" type="password" placeholder="Zugangscode" autocomplete="off" inputmode="numeric">
      <button id="loginBtn" class="btn primary" style="width:100%">Anmelden</button>
      <p id="loginErr" style="color:var(--red);margin-top:12px;display:none">Falscher Code.</p>
    </div>
  </div>

  <!-- App -->
  <div id="app" class="app hidden">
    <div class="topbar">
      <div class="brand"><span class="dot"></span> Greenchild Power-Dialer</div>
      <div class="counts">
        <span class="chip new" id="cNew">Neu 0</span>
        <span class="chip nr" id="cNr">Nicht erreicht 0</span>
      </div>
      <div class="spacer"></div>
      <label class="toggle"><input type="checkbox" id="autoAdvance" checked> Auto-Weiter</label>
      <button class="btn ghost" id="refreshBtn">↻ Neu laden</button>
      <button class="btn ghost" id="logoutBtn">Abmelden</button>
    </div>

    <div class="grid">
      <!-- Current lead -->
      <div class="card" id="mainCard">
        <!-- gefüllt via JS -->
      </div>

      <!-- Queue -->
      <div class="card">
        <div class="queue-head">
          <h2>Warteschlange</h2>
          <span class="chip" id="qCount">0</span>
        </div>
        <div class="queue-list" id="queueList"></div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="dialer.js"></script>
</body>
</html>
