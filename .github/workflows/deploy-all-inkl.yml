# Deployt die Website automatisch per FTPS auf den All-Inkl-Webspace.
#
# Es wird in ZWEI Ordner deployt, weil beide byte-identisch dieselbe Seite
# enthalten und unklar ist, welcher die Live-Domain ausliefert:
#   1) /greenchild.at/        (Domain-Ordner)
#   2) /<FTP_USERNAME>/        (Home-Ordner, Name = FTP-Benutzer; via Secret)
# So wird garantiert der richtige aktualisiert und beide bleiben synchron.
# Der Backup-Ordner "AlterStand" im Home-Ordner bleibt unangetastet
# (liegt nicht im Repo, kein clean-slate => wird nicht geloescht).
#
# Einmalige Einrichtung (GitHub -> Repo -> Settings -> Secrets and variables
# -> Actions -> Tab "Secrets"):
#   FTP_SERVER     Host aus KAS, z.B. wXXXXXX.kasserver.com
#   FTP_USERNAME   FTP-Benutzername (zugleich Name des Home-Ordners)
#   FTP_PASSWORD   FTP-Passwort
#
# Danach: jeder Push auf "main" deployt automatisch.
# Manueller Start / Trockenlauf: Actions -> "Deploy to All-Inkl" -> Run workflow.

name: Deploy to All-Inkl

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Trockenlauf (nichts hochladen, nur anzeigen)"
        type: boolean
        default: false

concurrency:
  group: deploy-all-inkl
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy -> /greenchild.at/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: /greenchild.at/
          dry-run: ${{ inputs.dry_run || false }}
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/*.md

      - name: Deploy -> /<FTP_USERNAME>/ (Home-Ordner)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: /${{ secrets.FTP_USERNAME }}/
          dry-run: ${{ inputs.dry_run || false }}
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/*.md
            # Backup-Ordner auf dem Server niemals anfassen:
            AlterStand/**
