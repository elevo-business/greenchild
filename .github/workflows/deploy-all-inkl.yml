# Deployt die Website per FTPS auf den All-Inkl-Webspace.
#
# Eigener Uploader (basic-ftp) mit Reconnect+Retry pro Datei, weil All-Inkl
# (ProFTPD) einzelne FTPS-Datenverbindungen sporadisch zuruecksetzt.
#
# Deployt in DREI Ordner (alle enthalten dieselbe Seite):
#   1) /greenchild.eu/   <- Hauptdomain greenchild.eu liefert hieraus aus
#   2) /greenchild.at/
#   3) /<FTP_USERNAME>/  (Home-Ordner; Name via Secret)
# Nicht-destruktiv: nur hoch-/ueberschreiben, nichts loeschen. Backup-Ordner
# "AlterStand" liegt nicht im Repo und bleibt unberuehrt.
#
# Secrets: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
# Push auf main deployt automatisch. Manuell/Trockenlauf: Run workflow.

name: Deploy to All-Inkl

on:
  push:
    branches:
      - main
      # TEMPORAER zum Verifizieren des eu-Deploys auf diesem Branch:
      - claude/clever-planck-uKo2s
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Trockenlauf (nichts hochladen, nur anzeigen)"
        type: boolean
        default: false

concurrency:
  group: deploy-all-inkl
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Staging vorbereiten (nur Website-Dateien)
        run: |
          mkdir -p _site
          cp -r assets css js de en sq index.html _site/
          echo "Staging-Inhalt:"; ls -1 _site

      - name: Deploy in alle Ordner (FTPS, mit Retry)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          npm install basic-ftp@5 --no-save --silent
          cat > deploy.mjs <<'EOF'
          import { Client } from "basic-ftp";
          import fs from "node:fs";
          import path from "node:path";

          const HOST = process.env.FTP_SERVER;
          const USER = process.env.FTP_USERNAME;
          const PASS = process.env.FTP_PASSWORD;
          const DRY = process.env.DRY_RUN === "true";
          const LOCAL = "_site";
          const targets = ["/greenchild.eu/", "/greenchild.at/", `/${USER}/`];
          const mask = (s) => s.split(USER).join("<USER>");

          function walk(dir, base = "") {
            const out = [];
            for (const e of fs.readdirSync(dir, { withFileTypes: true })) {
              const rel = base ? `${base}/${e.name}` : e.name;
              if (e.isDirectory()) out.push(...walk(path.join(dir, e.name), rel));
              else out.push(rel);
            }
            return out;
          }

          async function connect() {
            const c = new Client(30000);
            c.ftp.verbose = false;
            await c.access({
              host: HOST, user: USER, password: PASS, secure: true,
              secureOptions: { rejectUnauthorized: false },
            });
            return c;
          }

          async function deployTarget(target, files) {
            console.log(`\n### Ziel ${mask(target)} — ${files.length} Dateien`);
            if (DRY) { console.log("  Trockenlauf: kein Upload."); return; }
            let c = await connect();
            let lastDir = null;
            let done = 0;
            for (const rel of files) {
              const sub = path.dirname(rel);
              const remoteDir = sub === "." ? target : `${target}${sub}`;
              for (let attempt = 1; ; attempt++) {
                try {
                  if (remoteDir !== lastDir) { await c.ensureDir(remoteDir); lastDir = remoteDir; }
                  await c.uploadFrom(path.join(LOCAL, rel), path.basename(rel));
                  break;
                } catch (e) {
                  if (attempt >= 6) throw new Error(`${rel}: ${e.message}`);
                  console.log(`  ! ${rel} Versuch ${attempt} (${e.code || e.message}) — reconnect`);
                  try { c.close(); } catch {}
                  await new Promise((r) => setTimeout(r, Math.min(attempt * 2000, 8000)));
                  c = await connect();
                  lastDir = null;
                }
              }
              if (++done % 10 === 0 || done === files.length) console.log(`  ${done}/${files.length}`);
            }
            c.close();
            console.log(`### Fertig: ${mask(target)}`);
          }

          const files = walk(LOCAL);
          console.log(`Lokale Dateien: ${files.length}`);
          for (const t of targets) await deployTarget(t, files);
          console.log("\nAlle Ziele abgeschlossen.");
          EOF
          node deploy.mjs

      - name: Verifizieren greenchild.eu/de/ (nur auf diesem Branch)
        if: github.ref != 'refs/heads/main' && (inputs.dry_run != true)
        run: |
          cat > verify.mjs <<'EOF'
          const base = "https://greenchild.eu";
          const paths = ["/", "/de/", "/en/", "/assets/img/logo-greenchild.png"];
          for (const p of paths) {
            try {
              const r = await fetch(base + p, { redirect: "follow" });
              const b = Buffer.from(await r.arrayBuffer());
              const t = b.toString("utf8");
              const local = t.includes('src="/assets/img/logo-greenchild.png"');
              const old = t.includes("greenchild.eu/wp-content/uploads/2025/07/b2396e78.png");
              const extra = p.endsWith(".png") ? "" : `lokalesLogo=${local} alteURL=${old}`;
              console.log(`${p}  ->  ${r.status}  ${b.length}B  (final ${r.url})  ${extra}`);
            } catch (e) { console.log(`${p}  ->  ERR ${e.message}`); }
          }
          EOF
          node verify.mjs | tee _deploy-verify.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _deploy-verify.txt
          git commit -m "chore: deploy-verify greenchild.eu [skip ci]" || echo "nichts zu committen"
          git push origin HEAD:claude/clever-planck-uKo2s
