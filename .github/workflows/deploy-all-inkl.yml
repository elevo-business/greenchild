# Deployt die Website per FTPS auf den All-Inkl-Webspace.
#
# Eigener Uploader (basic-ftp) mit Reconnect+Retry pro Datei, weil All-Inkl
# (ProFTPD) einzelne FTPS-Datenverbindungen sporadisch zuruecksetzt.
#
# Deployt in DREI Ordner (alle enthalten dieselbe Seite):
#   1) /greenchild.eu/   <- Hauptdomain greenchild.eu liefert hieraus aus
#   2) /greenchild.at/
#   3) /<FTP_USERNAME>/  (Home-Ordner; Name via Secret)
# Nicht-destruktiv: nur hoch-/ueberschreiben, nichts loeschen. Backup-Ordner
# "AlterStand" liegt nicht im Repo und bleibt unberuehrt.
#
# Secrets: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
# Push auf main deployt automatisch. Manuell/Trockenlauf: Run workflow.

name: Deploy to All-Inkl

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Trockenlauf (nichts hochladen, nur anzeigen)"
        type: boolean
        default: false

concurrency:
  group: deploy-all-inkl
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Staging vorbereiten (nur Website-Dateien)
        run: |
          mkdir -p _site
          cp -r assets css js de en sq lp api index.html .htaccess _site/
          echo "Staging-Inhalt:"; ls -1A _site

      - name: Deploy in alle Ordner (FTPS, mit Retry)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          PD_WEBHOOK_SECRET: ${{ secrets.PD_WEBHOOK_SECRET }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_VERIFY_SERVICE_SID: ${{ secrets.TWILIO_VERIFY_SERVICE_SID }}
          PHONE_VERIFY_SECRET: ${{ secrets.PHONE_VERIFY_SECRET }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          # Secret-Dateien fuer api/pd-deal-won.php + api/verify-phone-*.php
          # erzeugen - BEWUSST ausserhalb von _site, damit sie nicht in die
          # oeffentlichen Webroots mit hochgeladen werden. Ueber ENV-Namen ->
          # Dateiname gesteuert, damit ein weiteres Secret kuenftig nur hier
          # einen Eintrag braucht (deploy.mjs liest das Verzeichnis generisch).
          mkdir -p _secret
          declare -A SECRET_FILES=(
            [PD_WEBHOOK_SECRET]=pd-webhook-secret.txt
            [TWILIO_ACCOUNT_SID]=twilio-account-sid.txt
            [TWILIO_AUTH_TOKEN]=twilio-auth-token.txt
            [TWILIO_VERIFY_SERVICE_SID]=twilio-verify-sid.txt
            [PHONE_VERIFY_SECRET]=phone-verify-secret.txt
          )
          for VAR_NAME in "${!SECRET_FILES[@]}"; do
            FILE_NAME="${SECRET_FILES[$VAR_NAME]}"
            VALUE="${!VAR_NAME}"
            if [ -n "$VALUE" ]; then
              printf '%s' "$VALUE" > "_secret/$FILE_NAME"
              echo "Secret-Datei vorbereitet: $FILE_NAME (Inhalt wird nicht geloggt)."
            else
              echo "Hinweis: $VAR_NAME ist nicht gesetzt - $FILE_NAME wird uebersprungen."
            fi
          done
          npm install basic-ftp@5 --no-save --silent
          cat > deploy.mjs <<'EOF'
          import { Client } from "basic-ftp";
          import fs from "node:fs";
          import path from "node:path";

          const HOST = process.env.FTP_SERVER;
          const USER = process.env.FTP_USERNAME;
          const PASS = process.env.FTP_PASSWORD;
          const DRY = process.env.DRY_RUN === "true";
          const LOCAL = "_site";
          const targets = ["/greenchild.eu/", "/greenchild.at/", `/${USER}/`];
          const mask = (s) => s.split(USER).join("<USER>");

          function walk(dir, base = "") {
            const out = [];
            for (const e of fs.readdirSync(dir, { withFileTypes: true })) {
              const rel = base ? `${base}/${e.name}` : e.name;
              if (e.isDirectory()) out.push(...walk(path.join(dir, e.name), rel));
              else out.push(rel);
            }
            return out;
          }

          async function connect() {
            const c = new Client(30000);
            c.ftp.verbose = false;
            await c.access({
              host: HOST, user: USER, password: PASS, secure: true,
              secureOptions: { rejectUnauthorized: false },
            });
            return c;
          }

          async function deployTarget(target, files) {
            console.log(`\n### Ziel ${mask(target)} — ${files.length} Dateien`);
            if (DRY) { console.log("  Trockenlauf: kein Upload."); return; }
            let c = await connect();
            let lastDir = null;
            let done = 0;
            for (const rel of files) {
              const sub = path.dirname(rel);
              const remoteDir = sub === "." ? target : `${target}${sub}`;
              for (let attempt = 1; ; attempt++) {
                try {
                  if (remoteDir !== lastDir) { await c.ensureDir(remoteDir); lastDir = remoteDir; }
                  await c.uploadFrom(path.join(LOCAL, rel), path.basename(rel));
                  break;
                } catch (e) {
                  if (attempt >= 6) throw new Error(`${rel}: ${e.message}`);
                  console.log(`  ! ${rel} Versuch ${attempt} (${e.code || e.message}) — reconnect`);
                  try { c.close(); } catch {}
                  await new Promise((r) => setTimeout(r, Math.min(attempt * 2000, 8000)));
                  c = await connect();
                  lastDir = null;
                }
              }
              if (++done % 10 === 0 || done === files.length) console.log(`  ${done}/${files.length}`);
            }
            c.close();
            console.log(`### Fertig: ${mask(target)}`);
          }

          const files = walk(LOCAL);
          console.log(`Lokale Dateien: ${files.length}`);
          for (const t of targets) await deployTarget(t, files);

          // Alle vorbereiteten Secret-Dateien in die FTP-Wurzel legen - also
          // OBERHALB von /greenchild.eu/ und /greenchild.at/. Die betroffenen
          // PHP-Endpunkte (pd-deal-won.php, verify-phone-*.php) suchen dort
          // ueber __DIR__ + '/../../', was von .../api aus genau hier landet.
          // Dort ist nichts ueber das Web erreichbar. Generisch ueber den
          // Verzeichnisinhalt statt Dateiname-fuer-Dateiname, damit ein
          // weiteres Secret kuenftig nur im vorigen Schritt ergaenzt werden muss.
          const SECRET_DIR = "_secret";
          const secretFiles = fs.existsSync(SECRET_DIR) ? fs.readdirSync(SECRET_DIR) : [];
          if (!secretFiles.length) {
            console.log("\nKeine Secret-Dateien vorhanden - uebersprungen.");
          } else if (DRY) {
            console.log(`\nTrockenlauf: ${secretFiles.length} Secret-Datei(en) nicht hochgeladen.`);
          } else {
            const c = await connect();
            await c.cd("/");
            for (const name of secretFiles) {
              await c.uploadFrom(path.join(SECRET_DIR, name), name);
              console.log(`  Secret-Datei hochgeladen: ${name}`);
            }
            c.close();
            console.log("\nSecret-Dateien in die FTP-Wurzel geschrieben (ausserhalb der Webroots).");
          }
          console.log("\nAlle Ziele abgeschlossen.");
          EOF
          node deploy.mjs
