# TEMPORAER: zeigt was greenchild.eu/ genau ausliefert (Body) und den
# Inhalt der index.html jedes Domain-Ordners. Read-only, schreibt nur
# das Ergebnis _probe-result.txt zurueck. Wird danach geloescht.

name: greenchild.eu pruefen (temporaer)

on:
  push:
    branches:
      - claude/clever-planck-uKo2s

concurrency:
  group: ftp-inspect
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Live-Body + index.html je Ordner (read-only)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          npm install basic-ftp@5 --no-save --silent
          cat > probe.mjs <<'EOF'
          import { Client } from "basic-ftp";
          import { Writable } from "node:stream";

          async function http(url) {
            try {
              const r = await fetch(url, { redirect: "follow" });
              const text = await r.text();
              return { status: r.status, finalUrl: r.url, bytes: text.length, text };
            } catch (e) { return { error: String(e.message || e) }; }
          }

          // 1) WAS genau liefert greenchild.eu/ aus? Body komplett zeigen.
          const r = await http("https://greenchild.eu/");
          console.log(`HTTP https://greenchild.eu/  ->  ${r.status ?? "ERR:" + r.error}  ${r.bytes ?? ""}B  (final ${r.finalUrl})`);
          console.log("----- BODY von greenchild.eu/ -----");
          console.log((r.text || "").slice(0, 2000));
          console.log("----- ENDE BODY -----");

          // 2) FTP: index.html jedes Domain-Ordners herunterladen + inspizieren
          async function ftpRead(client, path) {
            let buf = Buffer.alloc(0);
            const w = new Writable({ write(c, e, cb) { buf = Buffer.concat([buf, c]); cb(); } });
            await client.downloadTo(w, path);
            return buf.toString("utf8");
          }
          const c = new Client(15000);
          try {
            await c.access({ host: process.env.FTP_SERVER, user: process.env.FTP_USERNAME,
              password: process.env.FTP_PASSWORD, secure: true,
              secureOptions: { rejectUnauthorized: false } });
            const root = await c.list("/");
            try {
              const rootIdx = await ftpRead(c, "/index.htm");
              console.log(`\n===== /index.htm (Root, ${rootIdx.length}B) =====`);
              console.log(rootIdx.slice(0, 1500));
            } catch (e) { console.log("\n/index.htm nicht lesbar: " + e.message); }

            const dirs = root.filter((f) => f.isDirectory && !["logs","cgi-bin","tmp",".well-known"].includes(f.name));
            for (const d of dirs) {
              console.log(`\n===== /${d.name}/index.html =====`);
              try {
                const html = await ftpRead(c, "/" + d.name + "/index.html");
                const usesLocal = html.includes('src="/assets/img/logo-greenchild.png"');
                const usesOld = html.includes("greenchild.eu/wp-content/uploads/2025/07/b2396e78.png");
                console.log(`   Groesse=${html.length}B  lokalesLogo=${usesLocal}  alteURL=${usesOld}`);
                console.log("   erste 160 Zeichen:", JSON.stringify(html.slice(0, 160)));
              } catch (e) { console.log("   (nicht lesbar: " + e.message + ")"); }
            }
          } finally { c.close(); }
          EOF
          node probe.mjs | tee _probe-result.txt

      - name: Ergebnis zurueck ins Repo committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _probe-result.txt
          git commit -m "chore: Probe-Ergebnis v2 greenchild.eu [skip ci]" || echo "nichts zu committen"
          git push origin HEAD:claude/clever-planck-uKo2s
