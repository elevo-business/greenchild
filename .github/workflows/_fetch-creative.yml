# TEMPORAER: holt ein Ad-Creative aus dem freigegebenen Drive-Ordner,
# optimiert es fuers Web (ffmpeg) und erzeugt ein Poster-Standbild +
# Dimensions-Info. Committet die Ergebnisse zurueck. Wird danach entfernt.

name: Creative holen (temporaer)

on:
  workflow_dispatch:
  push:
    branches:
      - claude/clever-planck-uKo2s
    paths:
      - .github/workflows/_fetch-creative.yml

concurrency:
  group: fetch-creative
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Creative herunterladen, optimieren, Poster erzeugen
        env:
          # Plantation Walk 2663 (deutsche Tonspur)
          FILE_ID: "1rLOB_TK8GkfO1zIAoTcbVkSYBJb3A2_E"
          BASENAME: "lp-sachwert-hero"
        run: |
          set -e
          mkdir -p assets/video assets/img
          echo "Lade Creative ${FILE_ID} ..."
          curl -sL -o src.mp4 "https://drive.usercontent.google.com/download?id=${FILE_ID}&export=download&confirm=t"
          if [ "$(stat -c%s src.mp4)" -lt 100000 ] || head -c 15 src.mp4 | grep -qi "<!DOCTYPE\|<html"; then
            echo "FEHLER: Download lieferte keine Videodatei (evtl. nicht oeffentlich freigegeben)."
            head -c 400 src.mp4; exit 1
          fi
          echo "Quelle: $(du -h src.mp4 | cut -f1)"
          echo "=== ffprobe Quelle ===" | tee _creative-info.txt
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,duration,codec_name -of default=noprint_wrappers=1 src.mp4 | tee -a _creative-info.txt
          # Web-Optimierung: laengste Seite auf 1280 begrenzen, H.264, faststart, Audio behalten
          ffmpeg -y -i src.mp4 \
            -vf "scale='if(gt(a,1),1280,-2)':'if(gt(a,1),-2,1280)'" \
            -c:v libx264 -crf 26 -preset slow -movflags +faststart \
            -c:a aac -b:a 128k \
            "assets/video/${BASENAME}.mp4"
          # Poster-Standbild bei ~1.5s
          ffmpeg -y -ss 00:00:01.5 -i src.mp4 -frames:v 1 -q:v 3 "assets/img/${BASENAME}-poster.jpg"
          echo "" | tee -a _creative-info.txt
          echo "=== Ergebnis ===" | tee -a _creative-info.txt
          echo "Video: $(du -h assets/video/${BASENAME}.mp4 | cut -f1)" | tee -a _creative-info.txt
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of default=noprint_wrappers=1 "assets/video/${BASENAME}.mp4" | tee -a _creative-info.txt
          echo "Poster: $(du -h assets/img/${BASENAME}-poster.jpg | cut -f1)" | tee -a _creative-info.txt

      - name: Ergebnisse committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/video/lp-sachwert-hero.mp4 assets/img/lp-sachwert-hero-poster.jpg _creative-info.txt
          git commit -m "chore: Hero-Creative (Plantation Walk 2663) optimiert ablegen [skip ci]" || echo "nichts zu committen"
          git push origin HEAD:claude/clever-planck-uKo2s
